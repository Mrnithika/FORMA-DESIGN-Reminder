
name: Build FORMA DESIGN Reminder APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PROJECT_DIR: "FORMA_DESIGN_Reminder_Cloud_Build (1)/FORMA_DESIGN_Reminder"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FORMA-DESIGN-Reminder-APK
          path: "FORMA_DESIGN_Reminder_Cloud_Build (1)/FORMA_DESIGN_Reminder/app/build/outputs/apk/debug/app-debug.apk"
